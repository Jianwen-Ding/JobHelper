<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeM-M — JobHelper</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<!--
  The ResumeM-M editor beside the page. A bar that says which resume this is
  and a frame with the real editor in it; see panel.js for which resume, and
  why each of the messages below is shown.
-->
<header id="bar" class="bar">
  <button id="fold" class="icon" type="button" aria-expanded="true" aria-controls="main" title="Fold the editor away. It stays as you left it.">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="sr">Fold the editor</span>
  </button>
  <div class="who">
    <span id="label" class="label">ResumeM-M</span>
    <select id="picker" class="picker" aria-label="Resume shown in the editor" title="Switch the resume shown here" hidden></select>
    <span id="kind" class="kind" hidden></span>
  </div>
  <span id="saving" class="saving" hidden></span>
  <button id="newtab" class="icon" type="button" title="Open this resume in a tab of its own" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="sr">Open in a tab</span>
  </button>
  <button id="reload" class="icon" type="button" title="Reload the editor">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="sr">Reload</span>
  </button>
</header>

<main id="main" class="main">
  <p id="note" class="note" role="status" hidden></p>
  <div class="well">
    <div id="stage" class="stage" hidden>
      <iframe id="editor" title="ResumeM-M resume editor"></iframe>
    </div>
    <div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span><span id="loading-text">Opening the editor…</span></div>
    <section id="message" class="message" role="alert" hidden>
      <h2 id="message-title"></h2>
      <p id="message-text"></p>
      <pre id="message-code" hidden></pre>
      <p id="message-more" class="more" hidden></p>
      <div id="message-actions" class="actions"></div>
    </section>
  </div>
</main>
<p id="folded" class="folded" hidden>Folded. The editor is kept as you left it — unfold to carry on.</p>

<script type="module" src="panel.js"></script>
</body>
</html>
