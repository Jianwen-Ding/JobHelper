<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobHelper</title>
<style>
  /* Same system as the editor and the card. */
  :root {
    /* Google's Workspace palette, matching the editor and the card. */
    --accent: #1a73e8;
    --accent-hover: #1967d2;
    --accent-soft: #e8f0fe;
    --ink: #202124;
    --muted: #5f6368;
    --faint: #80868b;
    --line: #dadce0;
    --line-soft: #f1f3f4;
    --panel-sunk: #f8f9fa;
    --good: #188038;
    --good-bg: #e6f4ea;
    --bad: #d93025;
    --bad-bg: #fce8e6;
    --state-hover: rgba(60, 64, 67, .08);
    --accent-hover-layer: rgba(26, 115, 232, .08);
    --warn: #b06000;
    --warn-bg: #fef7e0;
    --warn-line: #feefc3;
  }
  * { box-sizing: border-box; }
  body {
    width: 326px;
    margin: 0;
    padding: 14px;
    font: 13px/1.5 "Google Sans Text", "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 15px; margin: 0 0 14px; font-weight: 500; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  h1::before {
    content: ""; width: 17px; height: 17px; border-radius: 5px;
    background: linear-gradient(145deg, var(--accent), #5b86e8);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55);
  }
  label { display: block; margin-bottom: 12px; }
  .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  input[type=text], select {
    width: 100%; font: inherit; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 4px; background: #fff; color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:hover, select:hover { border-color: var(--faint); }
  input[type=text]:focus-visible, select:focus-visible {
    outline: 0; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; cursor: pointer; }
  .check input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .check label { margin: 0; cursor: pointer; }
  /* Whether an AI is actually in play — which this checkbox alone does not
     decide, since ResumeM-M has its own switch. */
  .ai {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .ai::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ai.on { background: var(--accent-soft); color: var(--accent); }
  .ai.off { background: var(--line-soft); color: var(--muted); }
  .ai.warn { background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }

  /* The AI switch, grouped so the state and the thing that changes it are
     plainly one control rather than two neighbours. */
  .ai-panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    margin-top: 10px;
    background: var(--panel-sunk, #f8f9fa);
  }
  .ai-line { display: flex; align-items: center; gap: 7px; }
  .ai-command {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--faint, #80868b); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ai-command:empty { display: none; }
  .ai-fix {
    margin-left: auto; padding: 4px 11px; font-size: 11px; font-weight: 500;
    border: 1px solid var(--line); border-radius: 999px; background: #fff;
    color: var(--accent); cursor: pointer; white-space: nowrap;
  }
  .ai-fix:hover { background: var(--accent-soft); }
  .ai-panel .check { margin-top: 8px; }
  .ai-panel .hint { margin-top: 4px; }
  button {
    font: inherit; font-weight: 500; padding: 7px 16px;
    border: 1px solid var(--line); border-radius: 999px;
    background: #fff; cursor: pointer; color: var(--accent);
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  button:hover { background: var(--accent-hover-layer); }
  button.primary {
    background: var(--accent); border-color: transparent; color: #fff;
    box-shadow: 0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
  }
  button.primary:hover {
    background: var(--accent-hover);
    box-shadow: 0 1px 2px 0 rgba(60,64,67,.30), 0 2px 6px 2px rgba(60,64,67,.15);
  }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .row button { flex: 1 1 auto; }
  .status {
    margin-top: 12px; font-size: 12px; padding: 9px 12px; border-radius: 8px;
    background: var(--line-soft); color: var(--muted); border: 1px solid transparent; line-height: 1.5;
  }
  .status.ok { background: var(--good-bg); color: #0d652d; }
  /* A run that finished but left required fields empty is not a green result. */
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.err { background: var(--bad-bg); color: #b31412; }
  .hint { font-size: 11px; color: var(--faint); margin: -8px 0 12px; line-height: 1.5; }

  /*
   * What is being held right now.
   *
   * First in the window, because the badge on the toolbar is what sends people
   * here: they clicked it to find out what the number means, and the answer
   * should not be below the settings.
   */
  .open-app {
    margin: 0 0 14px; padding: 10px 12px; border-radius: 8px;
    background: var(--accent-soft); border: 1px solid transparent;
  }
  .open-app .who { font-weight: 500; color: var(--ink); }
  .open-app .what { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .open-app .row { margin-top: 9px; }
  .open-app button { background: #fff; }
</style>
</head>
<body>
<h1>JobHelper</h1>

<!--
  Shown only when there is one. An empty panel saying "no application open" is
  a line of furniture on every visit, and the absence already says it.
-->
<div class="open-app" id="openApplication" hidden>
  <div class="who" id="openWho"></div>
  <div class="what" id="openWhat"></div>
  <div class="row">
    <button id="backToApplication">Back to it</button>
    <button id="dropApplication">Start fresh</button>
  </div>
</div>

<label>
  <div class="lbl">ResumeM-M server</div>
  <input type="text" id="serverUrl" placeholder="http://127.0.0.1:4600">
</label>

<label>
  <div class="lbl">Start resumes from</div>
  <select id="baseResumeId"></select>
</label>
<div class="hint">Tailored resumes inherit from this one, so edits to it still reach them.</div>

<div class="check">
  <input type="checkbox" id="autoPrompt">
  <label for="autoPrompt">Offer automatically on job pages</label>
</div>

<!--
  The AI switch, stated in one place.

  Two things have to be true before anything is sent to an AI: ResumeM-M must
  have an AI command switched on, and this extension must be allowed to use it.
  Splitting them across two windows meant ticking the box here appeared to do
  nothing. Both are shown, and whichever one is holding things up has its own
  button right here.
-->
<div class="ai-panel" id="aiPanel">
  <div class="ai-line">
    <span id="aiState" class="ai off">AI off</span>
    <button id="aiFix" class="ai-fix" hidden></button>
  </div>
  <div class="check">
    <input type="checkbox" id="useAi">
    <label for="useAi">Let it use the AI when tailoring</label>
  </div>
  <!-- Nothing is known about the AI setting until the worker answers, so this
       says that rather than guessing. It used to ship the "off" hint — and
       not the current one either, but the sentence `AI_STATE.off` documents
       as retired, about an automatic decision that no longer happens. So the
       one moment the panel was certain to be read, before it had any news,
       was the moment it was wrong twice over. -->
  <div class="hint" id="aiHint">Reading ResumeM-M’s AI setting…</div>
  <!-- Which command would run. Its own line, because a name and a button
       competing for 360px is how "claude" became "c…". -->
  <div id="aiCommand" class="ai-command"></div>
</div>

<div class="row">
  <button id="show" class="primary">Open on this page</button>
  <button id="autofill">Autofill form</button>
</div>
<div class="row">
  <button id="mute">Mute this site</button>
  <button id="openApp">Open editor</button>
</div>

<div class="status" id="status">Checking server…</div>

<script src="popup.js" type="module"></script>
</body>
</html>
