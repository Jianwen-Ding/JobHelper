<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobHelper</title>
<style>
  body {
    width: 320px;
    margin: 0;
    padding: 12px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1c;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin-bottom: 10px; }
  .lbl { font-size: 12px; color: #6b6b73; margin-bottom: 3px; }
  input[type=text], select { width: 100%; font: inherit; padding: 5px 7px; border: 1px solid #dededf; border-radius: 6px; }
  .check { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .check label { margin: 0; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #dededf; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #2f5fd0; border-color: #2f5fd0; color: #fff; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .status { margin-top: 10px; font-size: 12px; padding: 7px 9px; border-radius: 6px; background: #f6f6f7; color: #6b6b73; }
  .status.ok { background: #eef6f0; color: #1a7f4b; }
  .status.err { background: #fdeeed; color: #b4251d; }
  .hint { font-size: 11px; color: #6b6b73; margin-top: -6px; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>JobHelper</h1>

<label>
  <div class="lbl">ResumeM-M server</div>
  <input type="text" id="serverUrl" placeholder="http://127.0.0.1:4600">
</label>

<label>
  <div class="lbl">Start resumes from</div>
  <select id="baseResumeId"></select>
</label>
<div class="hint">Tailored resumes inherit from this one, so edits to it still reach them.</div>

<div class="check">
  <input type="checkbox" id="autoPrompt">
  <label for="autoPrompt">Offer automatically on job pages</label>
</div>

<div class="check">
  <input type="checkbox" id="useAi">
  <label for="useAi">Also ask the AI CLI to tailor</label>
</div>
<div class="hint">Off by default — tag matching is instant and free, and usually right.</div>

<div class="row">
  <button id="show" class="primary">Open on this page</button>
  <button id="autofill">Autofill form</button>
</div>
<div class="row">
  <button id="mute">Mute this site</button>
  <button id="openApp">Open editor</button>
</div>

<div class="status" id="status">Checking server…</div>

<script src="popup.js" type="module"></script>
</body>
</html>
